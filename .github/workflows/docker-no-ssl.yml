name: Maven Package and pushing docker

on:
  release:
    types: [published]

  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    uses: ./.github/workflows/version-setup.yml

  build:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: change Web.xml to avoid use of ssl
        id: webxml
        run: |
          rm ${{ github.workspace }}/src/main/webapp/WEB-INF/web.xml
          mv ${{ github.workspace }}/docker/tomcat/web-no-ssl.xml ${{ github.workspace }}/src/main/webapp/WEB-INF/web.xml

      - name: Build a package
        run: |
          mvn -B -U --file pom.xml clean package -P release \
          "-Drevision=${{ needs.build-and-deploy.outputs.revision }}" \
          "-Dsha1=${{ needs.build-and-deploy.outputs.sha1 }}" \
          "-Dchangelist=${{ needs.build-and-deploy.outputs.changelist }}"

      - name: Temporarily save jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: ${{ github.workspace }}/target/*.war
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build, build-and-deploy]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jar-artifact
          path: target/

      - name: Docker build
        run: |
          docker build . --file docker/webstudio.dockerfile --target image-no-ssl \
            -t ${{ secrets.DOCKER_HUB_REPO }}/${{ secrets.DOCKER_HUB_REPO }}-webstudio-no-ssl:${{ needs.build-and-deploy.outputs.flattened_version }} \
            -t ${{ secrets.DOCKER_HUB_REPO }}/${{ secrets.DOCKER_HUB_REPO }}-webstudio-no-ssl:latest \
            --build-arg WEBSTUDIO_WAR_PATH=target/webstudio-${{ needs.build-and-deploy.outputs.flattened_version }}war

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker push
        run: |
          docker push ${{ secrets.DOCKER_HUB_REPO }}/${{ secrets.DOCKER_HUB_REPO }}-webstudio-no-ssl:${{ needs.build-and-deploy.outputs.flattened_version }}

